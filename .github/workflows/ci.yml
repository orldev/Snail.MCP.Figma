name: build and tests

# The shared server CI of Snail.Sdk: the tests, the conformance check, the reference the build writes, and the server
# built native for every platform it ships to and asked over stdio (the stdio contract tests only). Once a month, and by
# hand, the contract guards run against the latest Figma REST and Plugin API artifacts: this server's own job.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      contract-variable: SNAIL_FIGMA_SERVER
      contract-filter: FullyQualifiedName~StdioContract

  contracts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch the latest Figma API artifacts
        run: |
          mkdir -p /tmp/figma-latest && cd /tmp/figma-latest
          npm pack @figma/rest-api-spec @figma/plugin-typings
          for f in *.tgz; do d="${f%.tgz}"; mkdir "$d"; tar xzf "$f" -C "$d"; done
          cp figma-rest-api-spec-*/package/openapi/openapi.yaml "$GITHUB_WORKSPACE/tests/Contracts/Figma/openapi.yaml"
          cp figma-plugin-typings-*/package/plugin-api.d.ts "$GITHUB_WORKSPACE/tests/Contracts/Figma/plugin-api.d.ts"
          find figma-*/package -maxdepth 1 -type f | head -5

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build -c Release --no-restore

      - name: Run contract guards against the latest artifacts
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName~Tests.Contracts"
