name: release to NuGet

# The shared server release of Snail.Sdk (docs/publishing.md): one framework-dependent tool package, as the plugin
# bridge runs on ASP.NET Core, asked over stdio before it is pushed; .mcp/server.json takes the version. A v* tag
# releases; run by hand, it builds and checks the package and pushes only when asked to. The site is docs.yml's.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to pack, such as 0.2.0 or 0.2.0-preview.1
        required: true
      push:
        description: Push the package to NuGet
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: orldev/Snail.Sdk/.github/workflows/mcp-publish.yml@v1
    with:
      name: Snail.MCP.Figma
      native: false
      contract-variable: SNAIL_FIGMA_SERVER
      version: ${{ inputs.version }}
      push: ${{ github.event_name == 'push' || inputs.push }}
    secrets: inherit
