<!DOCTYPE html>
<!-- ==========================================================================
  FILE MAP — search a banner name to jump to its section
  CSS:    ТИХАЯ ЗЕМЛЯ palette · field (the whole inner area) · wave ·
          orb (expand button and agents in this file) · to-row (addressee) ·
          detail · log · banner
  Script: GLOBAL STATE · COMMAND INFRASTRUCTURE · VARIABLE OPERATIONS ·
          COMPONENT OPERATIONS · COMPONENT PROPERTY MANAGEMENT ·
          SLOT OPERATIONS · NODE MANIPULATION · SCREENSHOT & INSTANCE
          PROPERTIES · WEBSOCKET BRIDGE CLIENT · HTTP /health DISCOVERY LOOP ·
          ОКНО И ДВА СОСТОЯНИЯ · LOG PANEL & CLIPBOARD EXPORT · MESSAGE HANDLER
=========================================================================== -->
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== ТИХАЯ ЗЕМЛЯ — светлая палитра панели =====
       Одно полотно: поле занимает всю внутреннюю область окна, и его бортик
       и есть бортик панели. Вложенных поверхностей здесь нет — пространство
       делят волосяные линии, действия набраны текстом, вес шрифта везде один. */
    :root {
      --panel-bg:    #f7f7f8;
      --panel-line:  #e3e3e7;
      --panel-aim:   #a9acb2;
      --panel-hair:  #ededf0;
      --text:        #1d1e20;
      --text-dim:    #86868c;
      --text-hint:   #9a9aa0;
      --wait-bg:     #f3f3f4;
      --wait-line:   #e8e8ea;
      --wait-hint:   #a4a4aa;
      --wave-wait:   #e1e1e6;
      --wave-queued: #cfe0f5;
      --queued-ink:  #35557e;
      --wave-build:  #f4e9d2;
      --orb-bg:      #dee7da;
      --orb-line:    #c7d5c2;
      --orb-ink:     #4e6b4a;
      --orb-hover:   #cfdeca;
      --orb-press:   #bcd0b6;
      --orb-ring:    #c2c2c8;
      --loud:        #b0574b;
      --ochre:       #8a6a28;
      --sage:        #4e6b4a;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      background: var(--panel-bg);
      color: var(--text);
      user-select: none;
    }

    /* Focus ring sits inside the panel: the window has no room outside it. */
    button:focus-visible,
    input:focus-visible {
      outline: 1px solid var(--panel-aim);
      outline-offset: -3px;
    }

    button:focus:not(:focus-visible),
    input:focus:not(:focus-visible) {
      outline: none;
    }

    .panel {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* ===== Поле — вся внутренняя область окна ===== */
    .field {
      position: relative;
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 12px 0 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-line);
      overflow: hidden;
    }

    /* Ждём приложение: поле не принимает ввод, а подсказка работает строкой состояния. */
    .field.waiting {
      background: var(--wait-bg);
      border-color: var(--wait-line);
    }

    body.state-full .field {
      border-bottom-color: var(--panel-hair);
    }

    .field-input {
      position: relative;
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      line-height: 1;
    }

    .field-input:focus {
      outline: none;
    }

    .field-input::placeholder {
      color: var(--text-hint);
    }

    .field-input:disabled {
      -webkit-text-fill-color: var(--wait-hint);
      opacity: 1;
    }

    .field.waiting .field-input::placeholder {
      color: var(--wait-hint);
    }

    /* ===== Единственное движение в панели: волна по полю =====
       Меняются только цвет и темп — серая и медленная значит «ищем приложение»,
       охряная и быстрая значит «идёт сборка». Кнопка не двигается никогда. */
    .wave {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 120px;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--wave-wait), transparent);
    }

    .field.waiting .wave {
      opacity: 1;
      animation: sweep 1.8s linear infinite;
    }

    /* Замечание отправлено и ещё не прочитано. Единственный холодный тон в
       панели: всё остальное тёплое, поэтому «ждёт» не спутать со сборкой.
       Темп самый медленный — это не работа, а ожидание. */
    .field.queued .wave {
      opacity: 1;
      background: linear-gradient(90deg, transparent, var(--wave-queued), transparent);
      animation: sweep 2.4s linear infinite;
    }

    .field.queued .field-input::placeholder {
      color: var(--queued-ink);
    }

    /* Выделили слой — тот же самый проход волны, но ОДИН раз: состояния
       волнуются без конца, а выделение это событие. */
    .field.aiming .wave {
      opacity: 1;
      animation: sweep 0.7s ease-out 1;
    }

    .field.building .wave {
      opacity: 1;
      background: linear-gradient(90deg, transparent, var(--wave-build), transparent);
      animation: sweep 1s linear infinite;
    }

    /* Доля известна только серверу: плагин видит каждый шаг отдельной командой
       и не может отличить второй из десяти от последнего. Пока доля приходит,
       поле показывает её заливкой, а волна гаснет — движение уступает факту. */
    .done {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      background: var(--wave-build);
      transition: width 180ms linear;
      pointer-events: none;
    }

    .field.progress .wave {
      opacity: 0;
      animation: none;
    }

    @keyframes sweep {
      from { transform: translateX(-140px); }
      to   { transform: translateX(100vw); }
    }

    /* ===== Кнопка раскрытия — она же счётчик подключений ===== */
    .field-link {
      flex: none;
      margin-left: 8px;
    }

    .orb {
      position: relative;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin-left: 10px;
      padding: 0;
      border: 1px solid var(--orb-line);
      border-radius: 50%;
      background: var(--orb-bg);
      color: var(--orb-ink);
      font-family: inherit;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }

    .orb:hover  { background: var(--orb-hover); }
    .orb:active { background: var(--orb-press); }

    /* Ждём: кольцо без цифры. Кнопка обязана оставаться нажимаемой всегда. */
    .orb.waiting {
      background: transparent;
      border-color: var(--orb-ring);
      border-width: 1.5px;
      color: var(--text-dim);
    }

    .orb.waiting .orb-count {
      visibility: hidden;
    }

    /* Ошибка — единственный громкий цвет во всей панели. */
    .orb.failed {
      background: var(--loud);
      border-color: var(--loud);
      color: #ffffff;
    }

    .orb-chevron {
      display: none;
      width: 8px;
      height: 5px;
    }

    .orb:hover .orb-count   { display: none; }
    .orb:hover .orb-chevron { display: block; }

    body.state-full .orb-chevron {
      transform: rotate(180deg);
    }

    /* ===== Кому уйдёт замечание =====
       Строка появляется только когда в этом файле работают два агента и
       больше — одному адресат не нужен. Запятые вместо переключателя,
       выбранный подчёркнут. */
    .to-row {
      display: block;
      padding: 5px 12px 6px 14px;
      line-height: 1.5;
      border: 1px solid var(--panel-line);
      border-top: 0;
      font-size: 10px;
      color: var(--text-dim);
    }

    .to-row[hidden] { display: none; }

    .field.has-to,
    body.state-full .to-row {
      border-bottom-color: var(--panel-hair);
    }

    .to-link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--text-dim);
      font: inherit;
      cursor: pointer;
    }

    .to-link:hover { color: var(--text); }

    .to-link.chosen {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* «Некому»: единственный громкий цвет в панели, и только на три секунды.
       Набранный текст остаётся в поле — терять слова человека нельзя. */
    .field-note {
      position: absolute;
      right: 44px;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      padding-left: 8px;
      background: var(--panel-bg);
      color: var(--loud);
      font-size: 10px;
      pointer-events: none;
    }

    .field-note[hidden] { display: none; }

    /* ===== Раскрытое — то же полотно под волосяной чертой ===== */
    .detail {
      display: none;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--panel-line);
      border-top: 0;
    }

    body.state-full .detail {
      display: flex;
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 8px 14px;
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    #status-state {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .actions {
      display: flex;
      flex: none;
      gap: 10px;
    }

    /* Действия — текст, а не кнопки: коробка внутри полотна была бы второй поверхностью. */
    .link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--text-hint);
      font-family: inherit;
      font-size: 10px;
      text-transform: lowercase;
      cursor: pointer;
    }

    .link:hover { color: var(--text); }

    .link:disabled {
      color: var(--text-hint);
      opacity: 0.6;
      cursor: default;
    }

    .link[hidden] { display: none; }

    .log-entries {
      max-height: 150px;
      overflow-y: auto;
      padding: 0 12px 10px 14px;
      font-size: 9px;
      line-height: 1.7;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      color: var(--text-dim);
    }

    .log-ts {
      flex: none;
      opacity: 0.55;
      user-select: none;
    }

    .log-msg {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-count {
      flex: none;
      opacity: 0.5;
    }

    .log-dur { display: none; }

    .log-entry.success { color: var(--sage); }
    .log-entry.warn    { color: var(--ochre); }
    .log-entry.error   { color: var(--loud); }

    .update-banner {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 0 12px 10px 14px;
      font-size: 10px;
      line-height: 1.4;
      color: var(--ochre);
    }

    .update-banner.visible { display: flex; }

    .update-banner span {
      flex: 1;
      min-width: 0;
    }
  </style>
</head>
<body class="state-rest">
  <!-- Панель это одно полотно. Поле занимает всю внутреннюю область окна,
       справа сидит единственный элемент — кнопка раскрытия, она же счётчик
       агентов, работающих В ЭТОМ файле (подключённых серверов может быть
       больше — панель цепляется ко всем). -->
  <div class="panel" id="panel">
    <div class="field waiting" id="field">
      <div class="done" id="done" aria-hidden="true"></div>
      <div class="wave" id="wave" aria-hidden="true"></div>
      <input class="field-input" id="remark-input" type="text" placeholder="Looking for your app…" disabled onkeydown="remarkKeyDown(event)" aria-label="Remark to the running build">
      <span class="field-note" id="field-note" hidden>no agent is working in this file</span>
      <button class="link field-link" id="cancel-queue" onclick="cancelQueue()" title="Take the waiting remarks back" hidden>cancel</button>
      <button class="orb waiting" id="orb" onclick="togglePanelDetail()" title="Show what the bridge is doing" aria-label="Show what the bridge is doing" aria-expanded="false">
        <span class="orb-count" id="orb-count"></span>
        <svg class="orb-chevron" viewBox="0 0 10 6" aria-hidden="true" focusable="false">
          <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Адресат: только когда в файле два агента и больше -->
    <div class="to-row" id="to-row" hidden></div>

    <!-- Раскрытое: то же полотно под волосяной чертой — состояние, действия, лог -->
    <div class="detail" id="detail">
      <div class="detail-head">
        <span id="status-state" role="status" aria-live="polite">looking for your app…</span>
        <span class="actions">
          <button class="link" id="stop-link" onclick="stopBuild()" title="Stop the running build after the current step" hidden>stop</button>
          <button class="link" id="copy-log-btn" onclick="copyLogToClipboard()" title="Copy activity to clipboard">copy</button>
          <button class="link" id="cta-btn" onclick="toggleLocalConnection()">Pause</button>
        </span>
      </div>

      <div class="log-entries" id="log-entries"></div>

      <div class="update-banner" id="update-banner">
        <span>Plugin update available — re-import it in Figma.</span>
        <button class="link" onclick="dismissUpdateBanner()" title="Dismiss" aria-label="Dismiss update notice">×</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================================
    // GLOBAL STATE — backing store for the in-iframe WebSocket bridge client
    // ============================================================================
    window.__figmaVariablesData = null;
    window.__figmaVariablesReady = false;
    window.__figmaComponentData = null;
    window.__figmaComponentRequests = new Map();
    window.__figmaPendingRequests = new Map();

    let requestIdCounter = 0;

    // Status inputs owned by the message handler at the bottom of this file.
    // bridgeError flips true on a code.js ERROR message; a later successful
    // VARIABLES_DATA clears it (the plugin recovered).
    var bridgeError = false;

    // Single source of truth for what the panel shows. Derives the rendered
    // state from actual facts instead of trusting one-off events:
    //   - live WS connections from the connection pool
    //   - userPaused (pool exposes __wsIsPaused)
    //   - bridgeError (ERROR message from code.js)
    // Три состояния, больше нет: ждём · N приложений · ошибка. «Ищем сервер» и
    // «подключений ноль» слиты в одно — пока приложения нет, замечание всё
    // равно некуда отправлять.
    function deriveAndRenderStatus() {
      var field = document.getElementById('field');
      var input = document.getElementById('remark-input');
      var orb = document.getElementById('orb');
      var count = document.getElementById('orb-count');
      var stateText = document.getElementById('status-state');
      if (!field || !input || !orb || !count || !stateText) return;

      var conns = (typeof window.__wsGetActiveConnections === 'function') ? (window.__wsGetActiveConnections() || []) : [];
      var connected = 0;
      for (var i = 0; i < conns.length; i++) {
        if (conns[i] && conns[i].ws && conns[i].ws.readyState === 1) connected++;
      }
      // Считаются агенты, а не подключения: общий сервер — одно подключение на многих.
      var agents = (typeof window.__wsAgents === 'function') ? window.__wsAgents() : [];
      var live = agents.length;
      var here = agents.filter(function(agent) { return agent.bound; }).length;
      var paused = (typeof window.__wsIsPaused === 'function') ? window.__wsIsPaused() : false;

      var mode, text, hint;
      if (bridgeError) {
        mode = 'failed';
        text = 'something broke — close this window and reopen the plugin';
        hint = 'Bridge is down';
      } else if (paused) {
        mode = 'idle';
        text = 'paused — AI can\'t make changes';
        hint = 'Paused';
      } else if (connected >= 1) {
        mode = 'live';
        text = 'live · ' + whoWorksHere(here, live) + lastActionSuffix();
        hint = '';
      } else {
        mode = 'idle';
        text = 'looking for your app…';
        hint = 'Looking for your app…';
      }

      orb.classList.toggle('waiting', mode === 'idle');
      orb.classList.toggle('failed', mode === 'failed');
      count.textContent = here > 0 ? String(here) : '';
      orb.title = text;

      var offline = mode !== 'live';
      field.classList.toggle('waiting', offline);
      input.disabled = offline;
      if (offline) {
        // Нечего замечать, пока некому слать: поле молчит, а подсказка
        // работает строкой состояния.
        input.placeholder = hint;
      } else {
        renderAim();
      }

      stateText.textContent = text;
      stateText.title = text;
    }

    // Панель подключена ко всем серверам, а работает в этом файле обычно один.
    // Строка называет оба числа, чтобы «3 apps» не читалось как «три агента тут».
    function whoWorksHere(here, live) {
      // Общий сервер на связи, а сессий у него пока нет.
      if (live === 0) return 'no app yet';
      if (here === live) return live + ' app' + (live === 1 ? ' works here' : 's work here');
      if (here === 0) return 'none of ' + live + ' apps works here';
      return here + ' of ' + live + ' apps work' + (here === 1 ? 's' : '') + ' here';
    }

    // Proof of life for the expanded head — the "· 12s ago" after the state.
    function lastActionSuffix() {
      return _lastActionAt ? ' · ' + formatAgo(Date.now() - _lastActionAt) : '';
    }

    function formatAgo(ms) {
      var s = Math.max(0, Math.floor(ms / 1000));
      if (s < 60) return s + 's ago';
      var m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      var h = Math.floor(m / 60);
      return h + 'h ago';
    }

    // ============================================================================
    // COMMAND INFRASTRUCTURE - Generic plugin command sender
    // ============================================================================
    window.sendPluginCommand = (type, params, timeoutMs) => {
      timeoutMs = timeoutMs || 15000;
      return new Promise((resolve, reject) => {
        const requestId = type.toLowerCase() + '_' + (++requestIdCounter) + '_' + Date.now();

        const timeoutId = setTimeout(() => {
          if (window.__figmaPendingRequests.has(requestId)) {
            window.__figmaPendingRequests.delete(requestId);
            reject(new Error(type + ' request timed out after ' + timeoutMs + 'ms'));
          }
        }, timeoutMs);

        window.__figmaPendingRequests.set(requestId, { resolve: resolve, reject: reject, type: type, timeoutId: timeoutId });

        var message = { type: type, requestId: requestId };
        for (var key in params) {
          if (params.hasOwnProperty(key)) {
            message[key] = params[key];
          }
        }

        parent.postMessage({ pluginMessage: message }, '*');
        console.log('[MCP Bridge] Sent:', type);
      });
    };

    // ============================================================================
    // VARIABLE OPERATIONS
    // ============================================================================

    window.executeCode = (code, timeout) => {
      return window.sendPluginCommand('EXECUTE_CODE', { code: code, timeout: timeout || 5000 }, (timeout || 5000) + 2000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.updateVariable = (variableId, modeId, value) => {
      return window.sendPluginCommand('UPDATE_VARIABLE', { variableId: variableId, modeId: modeId, value: value })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.createVariable = (name, collectionId, resolvedType, options) => {
      var params = { name: name, collectionId: collectionId, resolvedType: resolvedType };
      if (options) {
        if (options.valuesByMode) params.valuesByMode = options.valuesByMode;
        if (options.description) params.description = options.description;
        if (options.scopes) params.scopes = options.scopes;
      }
      return window.sendPluginCommand('CREATE_VARIABLE', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.createVariableCollection = (name, options) => {
      var params = { name: name };
      if (options) {
        if (options.initialModeName) params.initialModeName = options.initialModeName;
        if (options.additionalModes) params.additionalModes = options.additionalModes;
      }
      return window.sendPluginCommand('CREATE_VARIABLE_COLLECTION', params)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.deleteVariable = (variableId) => {
      return window.sendPluginCommand('DELETE_VARIABLE', { variableId: variableId })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.deleteVariableCollection = (collectionId) => {
      return window.sendPluginCommand('DELETE_VARIABLE_COLLECTION', { collectionId: collectionId })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.renameVariable = (variableId, newName) => {
      return window.sendPluginCommand('RENAME_VARIABLE', { variableId: variableId, newName: newName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.setVariableDescription = (variableId, description) => {
      return window.sendPluginCommand('SET_VARIABLE_DESCRIPTION', { variableId: variableId, description: description })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.addMode = (collectionId, modeName) => {
      return window.sendPluginCommand('ADD_MODE', { collectionId: collectionId, modeName: modeName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.renameMode = (collectionId, modeId, newName) => {
      return window.sendPluginCommand('RENAME_MODE', { collectionId: collectionId, modeId: modeId, newName: newName })
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    window.refreshVariables = () => {
      return window.sendPluginCommand('REFRESH_VARIABLES', {}, 300000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });
    };

    // ============================================================================
    // COMPONENT OPERATIONS
    // ============================================================================

    window.getLocalComponents = () => {
      return window.sendPluginCommand('GET_LOCAL_COMPONENTS', {}, 300000)
        .catch(function(err) { return { success: false, error: err.message || String(err) }; });

       */
      // Set true only when the user clicks Pause. Suppresses the health
      // discovery loop so a deliberate pause is not undone automatically.
      var userPaused = false;

      function wsScanAndConnect() {
        resetDiscoveryPace();
        runDiscoveryPass();
      }

      /**
       * Reconnect a specific port that disconnected.
       * Tries the same port once (server may have just restarted); anything
       * slower is picked up by the /health discovery loop.
       */
      function wsReconnectPort(port) {
        if (userPaused || isPortConnected(port)) return;
        try {
          var testWs = new WebSocket('ws://localhost:' + port);
          var timeout = setTimeout(function() {
            if (testWs.readyState !== 1) testWs.close();
          }, 2000);

          testWs.onopen = function() {
            clearTimeout(timeout);
            activeConnections.push({ port: port, ws: testWs });
            updateCompatState();
            console.log('[MCP Bridge] Reconnected to port ' + port + ' (' + activeConnections.length + ' server(s) total)');
            attachWsHandlers(testWs, port);
            initializeConnection(testWs, port);
          };

          testWs.onerror = function() {
            clearTimeout(timeout);
          };
        } catch (e) {
          // Port gone — the discovery loop will find it if it comes back
        }
      }

      /**
       * Connect directly to a port the /health probe just verified is OUR
       * server. Same attach path as the scan, plus the server version the
       * probe reported (stored on the connection for display/diagnostics).
       */
      function wsConnectToPort(port, serverVersion) {
        if (userPaused || isPortConnected(port)) return;
        try {
          var testWs = new WebSocket('ws://localhost:' + port);
          var timeout = setTimeout(function() {
            if (testWs.readyState !== 1) testWs.close();
          }, 3000);

          testWs.onopen = function() {
            clearTimeout(timeout);
            var conn = { port: port, ws: testWs };
            if (serverVersion) conn.serverVersion = serverVersion;
            activeConnections.push(conn);
            updateCompatState();
            console.log('[MCP Bridge] WebSocket connected to port ' + port + (serverVersion ? ' (server v' + serverVersion + ')' : '') + ' (' + activeConnections.length + ' server(s) total)');
            attachWsHandlers(testWs, port);
            initializeConnection(testWs, port);
          };

          testWs.onerror = function() {
            clearTimeout(timeout);
          };
        } catch (e) {
          // ignore — next discovery pass will retry
        }
      }

      /**
       * Attach message/close/error handlers to an established WebSocket connection.
       */
      function attachWsHandlers(activeWs, port) {
        activeWs.onmessage = function(event) {
          try {
            var message = JSON.parse(event.data);

            // Handle server identity messages
            if (message.type === 'SERVER_HELLO' && message.data) {
              console.log('[MCP Bridge] Connected to server on port ' + message.data.port + ' (PID: ' + message.data.pid + ', v' + message.data.serverVersion + ')');
              var conn = activeConnections.find(function(c) { return c.ws === activeWs; });
              if (conn) {
                conn.serverInfo = message.data;
                if (message.data.serverVersion) conn.serverVersion = message.data.serverVersion;
                conn.agent = message.data.agent || ('' + message.data.port);
                conn.protocol = message.data.protocol || 1;
                onAgentsChanged();
              }
              return;
            }

            // Сервер сказал, работает ли его агент в ЭТОМ файле. Только по этому
            // флагу панель решает, кому уйдёт замечание и сколько агентов тут.
            if (message.type === 'TARGET_BOUND' && message.data) {
              var claimed = activeConnections.find(function(c) { return c.ws === activeWs; });
              if (claimed) {
                claimed.bound = !!message.data.bound;
                if (!claimed.bound && addressee === agentKey(agentsOf(claimed)[0])) addressee = null;
                onAgentsChanged();
              }
              return;
            }

            // Протокол 2: сервер называет всех своих агентов и говорит про каждого,
            // работает ли он в этом файле и сколько замечаний его ждёт.
            if (message.type === 'AGENTS' && message.data) {
              var carrier = activeConnections.find(function(c) { return c.ws === activeWs; });
              if (carrier) {
                var before = {};
                (carrier.agents || []).forEach(function(agent) { before[agent.id] = agent.lastCommandAt || 0; });
                carrier.protocol = 2;
                carrier.agents = (message.data.agents || []).map(function(entry) {
                  return {
                    conn: carrier,
                    id: entry.id,
                    name: entry.name || entry.id,
                    bound: !!entry.bound,
                    waiting: entry.waiting || 0,
                    lastCommandAt: before[entry.id] || 0
                  };
                });
                onAgentsChanged();
              }
              return;
            }

            // Сколько замечаний ещё ждёт чтения. Очередь живёт на сервере, и это
            // единственный способ узнать, что агент их забрал.
            // Какой шаг сборки идёт. Ноль означает, что сборка кончилась.
            if (message.type === 'BUILD_PROGRESS' && message.data) {
              if (typeof window.renderProgress === 'function') {
                window.renderProgress(message.data.step || 0, message.data.total || 0);
              }
              return;
            }

            if (message.type === 'REMARKS_WAITING' && message.data) {
              var owner = activeConnections.find(function(c) { return c.ws === activeWs; });
              if (owner) owner.remarksWaiting = message.data.waiting || 0;
              if (typeof window.renderQueue === 'function') window.renderQueue();
              return;
            }

            // Server says the installed plugin is older than it expects.
            if (message.type === 'PLUGIN_UPDATE_AVAILABLE') {
              if (typeof showUpdateBanner === 'function') showUpdateBanner();
              return;
            }

            // A connected server probed the port range from its side and
            // shares the live set — dial the servers we are not attached to.
            if (message.type === 'PORTS_ALIVE') {
              var alivePorts = (message.data && message.data.ports) || [];
              for (var pa = 0; pa < alivePorts.length; pa++) {
                if (!isPortConnected(alivePorts[pa])) wsConnectToPort(alivePorts[pa]);
              }
              return;
            }

            if (!message.id || !message.method) {
              console.log('[MCP Bridge] WS:' + port + ': Ignoring malformed message');
              return;
            }

            // Команда не делает сервер адресатом — это говорит TARGET_BOUND.
            // Но среди двух агентов, работающих тут, по умолчанию отвечает тот,
            // кто командовал последним.
            var commander = activeConnections.find(function(c) { return c.ws === activeWs; });
            if (commander && commander.agents && message.agent) {
              commander.agents.forEach(function(agent) {
                if (agent.id === message.agent) agent.lastCommandAt = Date.now();
              });
            } else if (commander) {
              commander.lastCommandAt = Date.now();
            }

            var handler = methodMap[message.method];
            if (!handler) {
              activeWs.send(JSON.stringify({ id: message.id, error: 'Unknown method: ' + message.method }));
              return;
            }

            // Call the handler (returns a Promise) and send back the result
            Promise.resolve(handler(message.params || {}))
              .then(function(result) {
                if (activeWs.readyState === 1) {
                  activeWs.send(JSON.stringify({ id: message.id, result: result }));
                }
              })
              .catch(function(err) {
                if (activeWs.readyState === 1) {
                  activeWs.send(JSON.stringify({ id: message.id, error: err.message || String(err) }));
                }
              });
          } catch (e) {
            console.error('[MCP Bridge] WS:' + port + ': Failed to process message:', e);
          }
        };

        activeWs.onclose = function(event) {
          removeConnection(port);
          console.log('[MCP Bridge] WebSocket disconnected from port ' + port + ' (' + activeConnections.length + ' server(s) remaining)');

          // If replaced by same file reconnecting (e.g., plugin reloaded), stop
          var wasReplaced = (event.code === 1000 && (
            event.reason === 'Replaced by new connection' ||
            event.reason === 'Replaced by same file reconnection'
          ));
          // If user paused via the Pause button, also stop auto-reconnect.
          var wasManualPause = (event.code === 1000 && event.reason === 'Manual disconnect');
          if (wasReplaced || wasManualPause) {
            console.log('[MCP Bridge] WebSocket:' + port + ': stopped by ' + (wasManualPause ? 'user pause' : 'replacement'));
            return;
          }

          // One immediate same-port retry covers fast same-port server
          // restarts; anything slower is picked up by the /health discovery
          // loop, so the old capped retry-with-backoff dance is gone.
          setTimeout(function() { wsReconnectPort(port); }, 1000);
        };

        activeWs.onerror = function() {
          // onclose will fire after this, triggering reconnect
        };
      }

      // Агент — тот, кому панель адресует замечание. Сервер протокола 2 сам
      // называет своих агентов (AGENTS), и одно подключение несёт нескольких;
      // старый сервер — это один агент на подключение, как было всегда.
      function agentsOf(conn) {
        if (conn.agents) return conn.agents;
        return [{
          conn: conn,
          id: null,
          name: conn.agent || ('' + conn.port),
          bound: !!conn.bound,
          waiting: conn.remarksWaiting || 0,
          lastCommandAt: conn.lastCommandAt || 0
        }];
      }

      function agentKey(agent) {
        return agent.conn.port + '/' + (agent.id || '');
      }

      function liveAgents() {
        var all = [];
        activeConnections.forEach(function(conn) {
          if (conn.ws.readyState === 1) all = all.concat(agentsOf(conn));
        });
        return all;
      }

      // Кто работает в этом файле — только те агенты, о которых это сказал их сервер.
      function boundAgents() {
        return liveAgents().filter(function(agent) { return agent.bound; });
      }

      function agentName(agent) {
        return agent.name;
      }

      // Явный выбор человека: ключ агента или 'all'. Пусто — по умолчанию.
      var addressee = null;

      // По умолчанию отвечает тот из работающих тут, кто командовал последним;
      // пока никто не командовал — первый.
      function defaultAddressee(bound) {
        var latest = bound[0];
        for (var i = 1; i < bound.length; i++) {
          if ((bound[i].lastCommandAt || 0) > (latest.lastCommandAt || 0)) latest = bound[i];
        }
        return latest;
      }

      function currentAddressee(bound) {
        if (bound.length <= 1) return bound[0] || null;
        if (addressee === 'all') return 'all';
        for (var i = 0; i < bound.length; i++) {
          if (agentKey(bound[i]) === addressee) return bound[i];
        }
        return defaultAddressee(bound);
      }

      // Сообщение, адресованное агенту: серверу протокола 2 — с его id, старому — как есть.
      function addressed(message, agent) {
        if (!agent.id) return message;
        var data = {};
        var source = message.data || {};
        for (var field in source) {
          if (Object.prototype.hasOwnProperty.call(source, field)) data[field] = source[field];
        }
        data.agent = agent.id;
        return { type: message.type, data: data };
      }

      /**
       * Send to the agents working in this file: the chosen one, or all of
       * them when the human said so. An empty answer means there is nobody.
       */
      function sendToAgents(message) {
        var bound = boundAgents();
        var current = currentAddressee(bound);
        var targets = current === 'all' ? bound : (current ? [current] : []);
        targets.forEach(function(agent) {
          try { agent.conn.ws.send(JSON.stringify(addressed(message, agent))); } catch (e) { /* the close handler will drop it */ }
        });
        return targets;
      }

      function namesOf(targets) {
        return targets.map(agentName).join(', ');
      }

      // Серверы друг друга не видят; кто ещё работает в файле, знает только
      // панель. Каждому — имена агентов других подключений: своих он знает сам.
      function announcePeers() {
        var bound = boundAgents();
        activeConnections.forEach(function(conn) {
          if (conn.ws.readyState !== 1) return;
          var others = bound.filter(function(agent) { return agent.conn !== conn; }).map(agentName);
          try { conn.ws.send(JSON.stringify({ type: 'PEERS', data: { agents: others } })); } catch (e) { /* ignore */ }
        });
      }

      function onAgentsChanged() {
        announcePeers();
        if (typeof window.renderAgents === 'function') window.renderAgents();
        if (typeof window.renderQueue === 'function') window.renderQueue();
        if (typeof deriveAndRenderStatus === 'function') deriveAndRenderStatus();
      }

      window.__wsAgents = liveAgents;
      window.__wsBoundAgents = boundAgents;
      window.__wsAgentName = agentName;
      window.__wsAgentKey = agentKey;
      window.__wsCurrentAddressee = function() { return currentAddressee(boundAgents()); };
      window.__wsChooseAgent = function(keyOrAll) {
        addressee = keyOrAll;
        if (typeof window.renderAgents === 'function') window.renderAgents();
      };

      function broadcastToAll(message) {
        var json = JSON.stringify(message);
        activeConnections.forEach(function(conn) {
          if (conn.ws.readyState === 1) {
            try { conn.ws.send(json); } catch(e) { /* ignore send errors */ }
          }
        });
      }

      // Stop a running build: the server checks this between steps, so the
      // canvas is left at a whole step rather than half a node.
      // Забрать очередь обратно, пока её никто не прочитал. Очередь есть только
      // у работающих тут серверов — остальные замечание и не принимали.
      window.cancelQueue = function() {
        boundAgents().forEach(function(agent) {
          try { agent.conn.ws.send(JSON.stringify(addressed({ type: 'REMARKS_CLEAR' }, agent))); } catch (e) { /* ignore */ }
        });
        logWithHistory('Queue cleared — the remarks were taken back', 'warn');
      };

      window.stopBuild = function() {
        var targets = sendToAgents({ type: 'BUILD_STOP' });
        if (targets.length === 0) {
          showFieldNote();
          logWithHistory('Stop requested, but no agent is working in this file', 'warn');
          return;
        }
        logWithHistory('Stop requested from ' + namesOf(targets) + ' — the build ends after the current step', 'warn');
      };

      // What is selected right now, sent along with a remark so it points at a
      // part of a big frame instead of at the build as a whole.
      var lastSelection = [];

      function updateRemarkTarget() {
        window.__aim = lastSelection;
        if (typeof window.renderAim === 'function') window.renderAim();
      }

      window.remarkKeyDown = function(event) {
        if (event.key === 'Escape') {
          event.target.value = '';
          return;
        }
        if (event.key !== 'Enter') return;
        var remark = event.target.value.trim();
        if (!remark) return;
        var targets = sendToAgents({ type: 'BUILD_STOP', data: { remark: remark, nodes: lastSelection } });
        if (targets.length === 0) {
          // Слова остаются в поле: человек их набрал, терять их нельзя.
          showFieldNote();
          logWithHistory('Remark not sent — no agent is working in this file', 'warn');
          return;
        }
        var canvas = document.getElementById('field');
        var running = canvas && canvas.classList.contains('building');
        logWithHistory('Remark sent to ' + namesOf(targets) + (running
          ? ' — the build ends after the current step'
          : ' — waiting for the agent to read it'), 'warn');
        event.target.value = '';
      };

      // Forward VARIABLES_DATA to all connected MCP servers
      window.__wsForwardVariables = function(data) {
        if (wsConnected) {
          broadcastToAll({ type: 'VARIABLES_DATA', data: data });
        }
      };

      // Forward DOCUMENT_CHANGE events to all servers for cache invalidation
      window.__wsForwardDocumentChange = function(data) {
        if (wsConnected) {
          broadcastToAll({ type: 'DOCUMENT_CHANGE', data: data });
        }
      };

      // v1.25.0: forward METADATA_CHANGE events (description/annotation edits)
      // so figma_diff_versions can surface them despite Figma REST not exposing them.
      window.__wsForwardMetadataChange = function(data) {
        if (wsConnected) {
          broadcastToAll({ type: 'METADATA_CHANGE', data: data });
        }
      };

      // Forward CONSOLE_CAPTURE events to all servers for console monitoring
      window.__wsForwardConsoleCapture = function(data) {
        if (wsConnected) {
          broadcastToAll({ type: 'CONSOLE_CAPTURE', data: data });
        }
      };

      // Forward SELECTION_CHANGE events to all servers for selection tracking
      window.__wsForwardSelectionChange = function(data) {
        lastSelection = (data && data.nodes) ? data.nodes : [];
        updateRemarkTarget();
        if (wsConnected) {
          broadcastToAll({ type: 'SELECTION_CHANGE', data: data });
        }
      };

      // Forward PAGE_CHANGE events to all servers for page tracking
      window.__wsForwardPageChange = function(data) {
        if (wsConnected) {
          broadcastToAll({ type: 'PAGE_CHANGE', data: data });
        }
      };

      window.__wsGetActiveConnections = function() { return activeConnections; };

      window.__wsDisconnectAll = function() {
        for (var i = 0; i < activeConnections.length; i++) {
          try { activeConnections[i].ws.close(1000, 'Manual disconnect'); } catch (e) {}
        }
        activeConnections = [];
        ws = null;
        wsConnected = false;
        // Deliberate user pause — keep discovery quiet until Resume.
        userPaused = true;
      };

      window.__wsScanAndConnect = wsScanAndConnect;

      // Manual (re)connect from the UI: clear any pause and restart the fast
      // probe window.
      window.__wsManualScan = function() {
        userPaused = false;
        wsScanAndConnect();
      };

      window.__wsIsPaused = function() { return userPaused; };
      window.__wsIsScanning = function() { return discoveryInFlight; };
      // The health discovery loop is armed whenever the user hasn't paused —
      // used by the status pill to show "Looking for your AI app…" honestly.
      window.__wsIsDiscoveryActive = function() { return !userPaused; };

      // ======================================================================
      // HTTP /health DISCOVERY LOOP — the only thing that probes ports from
      // the browser, and only while there is no live connection. fetch() to a
      // closed port rejects catchably in JS, but Chrome still logs its own
      // net::ERR_CONNECTION_REFUSED line to the DevTools console for every
      // attempt — no amount of try/catch suppresses that. So the loop paces
      // itself:
      //   - every 3s for the first ~10 passes after load, resume or a
      //     disconnect (fast attach while a server start is likely);
      //   - every 30s after that (a quiet background watch);
      //   - not at all while >=1 connection is live — each connected server
      //     scans the range from its side (silent there) and pushes
      //     PORTS_ALIVE, which is how additional servers get attached.
      // A port only gets a WS dial after its /health response matches OUR
      // server's payload shape ({status:'ok', version, connectedFiles, ...}).
      // ======================================================================
      var HEALTH_TIMEOUT_MS = 1500;
      var DISCOVERY_FAST_MS = 3000;
      var DISCOVERY_SLOW_MS = 30000;
      var DISCOVERY_FAST_PASSES = 10;
      var discoveryTimer = null;
      var discoveryInFlight = false;
      var fastPassesLeft = DISCOVERY_FAST_PASSES;

      function resetDiscoveryPace() {
        fastPassesLeft = DISCOVERY_FAST_PASSES;
      }

      function liveConnectionCount() {
        var n = 0;
        for (var i = 0; i < activeConnections.length; i++) {
          if (activeConnections[i].ws.readyState === 1) n++;
        }
        return n;
      }

      function isOurHealthPayload(json) {
        // Shape served by the C# bridge /health (EditorLinkHostingExtensions).
        // The donor's websocket-server.ts sent `clients`; the C# server sends
        // `connectedFiles` — checking the old field meant never recognizing
        // our own server, so discovery probed forever without connecting.
        return !!(json && json.status === 'ok' && typeof json.version === 'string' && json.connectedFiles !== undefined);
      }

      function probePortHealth(port) {
        var opts = {};
        try {
          if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
            opts.signal = AbortSignal.timeout(HEALTH_TIMEOUT_MS);
          }
        } catch (e) { /* AbortSignal unavailable — fetch just runs untimed */ }
        return fetch('http://localhost:' + port + '/health', opts)
          .then(function(res) {
            if (!res.ok) return null;
            return res.json().then(function(json) {
              return isOurHealthPayload(json) ? { port: port, version: json.version } : null;
            });
          })
          .catch(function() { return null; }); // closed port / timeout / non-JSON — all quiet
      }

      function scheduleDiscovery() {
        if (discoveryTimer) clearTimeout(discoveryTimer);
        // Connected: the browser goes quiet, PORTS_ALIVE covers discovery.
        if (liveConnectionCount() > 0) return;
        var delay = fastPassesLeft > 0 ? DISCOVERY_FAST_MS : DISCOVERY_SLOW_MS;
        discoveryTimer = setTimeout(runDiscoveryPass, delay);
      }

      function runDiscoveryPass() {
        if (discoveryInFlight) { scheduleDiscovery(); return; }
        if (userPaused) { scheduleDiscovery(); return; } // never auto-connect while paused
        if (fastPassesLeft > 0) fastPassesLeft--;
        var candidates = [];
        for (var p = WS_PORT_RANGE_START; p <= WS_PORT_RANGE_END; p++) {
          if (!isPortConnected(p)) candidates.push(p);
        }
        if (candidates.length === 0) { scheduleDiscovery(); return; }
        discoveryInFlight = true;
        Promise.all(candidates.map(probePortHealth))
          .then(function(results) {
            for (var i = 0; i < results.length; i++) {
              var hit = results[i];
              if (hit && !userPaused && !isPortConnected(hit.port)) {
                wsConnectToPort(hit.port, hit.version);
              }
            }
          })
          .catch(function() { /* individual probes already swallow errors */ })
          .then(function() {
            discoveryInFlight = false;
            scheduleDiscovery();
          });
      }

      // Initial health-first attach. The loop then keeps probing while
      // disconnected (fast, then slow) and goes silent once connected.
      // Disconnect-triggered same-port retries handle quick drops.
      wsScanAndConnect();
    })();

    // ============================================================================
    // ОКНО И ДВА СОСТОЯНИЯ ПАНЕЛИ
    // rest — только поле, окно 300×40;
    // full — то же полотно плюс состояние, действия и лог, высота по содержимому.
    // ============================================================================

    // 300 px — ширина, на которой поле остаётся полем, а не строкой в две буквы.
    // Меньше 70×20 Figma окно всё равно не отдаёт.
    var PLUGIN_WIDTH = 300;

    // While locked, the panel stops asking Figma for its own size. The sandbox
    // sets it to measure the real window limits; otherwise the ResizeObserver
    // below restores the height on the next log line and fights whoever
    // shrank the window.
    var sizeLocked = false;

    function sendResize() {
      if (sizeLocked) return;
      // Force a layout pass so the measurement reflects the current state.
      void document.body.offsetHeight;
      var panel = document.querySelector('.panel');
      if (!panel) return;
      parent.postMessage({
        pluginMessage: { type: 'RESIZE_UI', width: PLUGIN_WIDTH, height: Math.ceil(panel.offsetHeight) }
      }, '*');
    }

    var panelState = 'rest';

    function setPanelState(next) {
      if (next === panelState) return;
      panelState = next;
      document.body.classList.remove('state-rest', 'state-full');
      document.body.classList.add('state-' + next);
      var orb = document.getElementById('orb');
      if (orb) orb.setAttribute('aria-expanded', next === 'full' ? 'true' : 'false');
      autoResize();
    }

    window.togglePanelDetail = function() {
      setPanelState(panelState === 'full' ? 'rest' : 'full');
    };

    // Прицел: имя выделенного слоя встаёт в подсказку, и по полю один раз
    // проходит волна. Бортик в это не вмешивается — он всегда нейтральный.
    var _aimSignature = '';
    var _aimTimer = null;

    window.renderAim = function() {
      var field = document.getElementById('field');
      var input = document.getElementById('remark-input');
      if (!field || !input || input.disabled) return;
      var nodes = window.__aim || [];
      input.placeholder = aimPlaceholder(nodes);

      // deriveAndRenderStatus зовёт этот код каждые две секунды, поэтому волна
      // трогается только когда выделение действительно сменилось.
      var signature = nodes.map(function(node) { return node.id || node.name || ''; }).join(',');
      if (signature === _aimSignature) return;
      _aimSignature = signature;
      if (nodes.length > 0) pulseAim(field);
    };

    // Одиночный проход волны — «заметил, целюсь сюда». Во время сборки молчит:
    // там та же волна уже идёт по кругу, и второй смысл ей не нужен.
    function pulseAim(field) {
      if (field.classList.contains('building')) return;
      field.classList.remove('aiming');
      void field.offsetWidth;
      field.classList.add('aiming');
      if (_aimTimer) clearTimeout(_aimTimer);
      _aimTimer = setTimeout(function() {
        _aimTimer = null;
        field.classList.remove('aiming');
      }, 700);
    }

    var _remarksWaiting = 0;

    // Ждущие замечания важнее прицела: пока их не прочитали, поле говорит об
    // очереди, а не о том, куда уйдёт следующее.
    window.renderQueue = function() {
      var field = document.getElementById('field');
      var cancel = document.getElementById('cancel-queue');
      if (!field) return;
      var waiting = 0;
      var bound = (typeof window.__wsBoundAgents === 'function') ? window.__wsBoundAgents() : [];
      for (var i = 0; i < bound.length; i++) {
        if (bound[i] && bound[i].waiting > waiting) waiting = bound[i].waiting;
      }
      _remarksWaiting = waiting;
      field.classList.toggle('queued', waiting > 0 && !field.classList.contains('waiting'));
      if (cancel) cancel.hidden = waiting === 0;
      renderAim();
    };

    // Шаг сборки, пока он известен. Ноль означает, что сборки нет.
    var _buildStep = 0;
    var _buildTotal = 0;

    window.renderProgress = function(step, total) {
      var field = document.getElementById('field');
      var done = document.getElementById('done');
      if (!field || !done) return;

      _buildStep = step;
      _buildTotal = total;

      if (!step || !total) {
        field.classList.remove('progress');
        done.style.width = '0';
        renderAim();
        return;
      }

      field.classList.add('progress');
      done.style.width = Math.round((step / total) * 100) + '%';
      renderAim();
    };

    function aimPlaceholder(nodes) {
      if (_buildTotal > 0 && _buildStep > 0) return 'step ' + _buildStep + ' of ' + _buildTotal + '…';
      if (_remarksWaiting === 1) return 'queued';
      if (_remarksWaiting > 1) return _remarksWaiting + ' queued';
      var bound = (typeof window.__wsBoundAgents === 'function') ? window.__wsBoundAgents() : [];
      if (bound.length === 0) return 'No agent is working in this file';
      var to = bound.length > 1 ? addresseeLabel() : '';
      if (!nodes || nodes.length === 0) return 'Remark to ' + (to || 'the build') + '…';
      if (nodes.length > 1) return 'Remark to ' + (to ? to + ' · ' : '') + nodes.length + ' layers…';
      var name = nodes[0].name || 'selected layer';
      if (name.length > 22) name = name.slice(0, 21) + '…';
      return 'Remark to ' + (to ? to + ' · ' : '') + '«' + name + '»…';
    }

    function addresseeLabel() {
      var current = (typeof window.__wsCurrentAddressee === 'function') ? window.__wsCurrentAddressee() : null;
      if (current === 'all') return 'all';
      return current ? window.__wsAgentName(current) : '';
    }

    // Строка адресатов — раскрытие под полем, только при двух агентах и больше.
    window.renderAgents = function() {
      var row = document.getElementById('to-row');
      var field = document.getElementById('field');
      if (!row || !field) return;
      var bound = (typeof window.__wsBoundAgents === 'function') ? window.__wsBoundAgents() : [];
      if (bound.length < 2) {
        row.hidden = true;
        row.textContent = '';
        field.classList.remove('has-to');
        renderAim();
        autoResize();
        return;
      }
      var current = window.__wsCurrentAddressee();
      row.textContent = '';
      row.appendChild(document.createTextNode('to '));
      var choices = bound.map(function(agent) {
        var key = window.__wsAgentKey(agent);
        return { key: key, name: window.__wsAgentName(agent), chosen: current !== 'all' && !!current && window.__wsAgentKey(current) === key };
      });
      choices.push({ key: 'all', name: 'all', chosen: current === 'all' });
      choices.forEach(function(choice, index) {
        if (index > 0) row.appendChild(document.createTextNode(', '));
        var link = document.createElement('button');
        link.className = 'to-link' + (choice.chosen ? ' chosen' : '');
        link.textContent = choice.name;
        link.title = choice.key === 'all' ? 'Send the remark to every agent in this file' : 'Send the remark to ' + choice.name;
        link.onclick = function() { window.__wsChooseAgent(choice.key); };
        row.appendChild(link);
      });
      row.hidden = false;
      field.classList.add('has-to');
      renderAim();
      autoResize();
    };

    // «Некому»: три секунды громким цветом, текст в поле не трогаем.
    var _noteTimer = null;

    function showFieldNote() {
      var note = document.getElementById('field-note');
      if (!note) return;
      note.hidden = false;
      if (_noteTimer) clearTimeout(_noteTimer);
      _noteTimer = setTimeout(function() {
        _noteTimer = null;
        note.hidden = true;
      }, 3000);
    }

    // Единственное движение в панели — волна по полю. Шаги сборки приходят
    // отдельными командами, поэтому панель видит их сама и гасит волну по
    // тишине. Долю «шаг i из N» знает только сервер: когда мост научится её
    // присылать, волна сменится заливкой поля.
    var _buildTimer = null;

    function markBuildActivity() {
      var field = document.getElementById('field');
      if (!field) return;
      field.classList.add('building');
      renderStopLink(true);
      if (_buildTimer) clearTimeout(_buildTimer);
      _buildTimer = setTimeout(function() {
        _buildTimer = null;
        var quiet = document.getElementById('field');
        if (quiet) quiet.classList.remove('building');
        renderStopLink(false);
      }, 1500);
    }

    // Остановить сборку можно только пока она идёт — в покое ссылки нет.
    function renderStopLink(building) {
      var stop = document.getElementById('stop-link');
      if (stop) stop.hidden = !building;
    }

    function autoResize() {
      sendResize(); // immediate — fires before next paint so Figma can grow upward in the same frame
      requestAnimationFrame(function() {
        sendResize();
        setTimeout(sendResize, 150);
      });
    }

    // Observe the panel itself, so any row toggle fires a resize whether the
    // content grew or shrank.
    if (typeof ResizeObserver !== 'undefined') {
      var _panelObserve = function() {
        var panel = document.querySelector('.panel');
        if (panel) { var ro = new ResizeObserver(sendResize); ro.observe(panel); }
      };
      _panelObserve();
    }

    // Initial tighten — multiple attempts at different times to defeat any
    // residual Figma-side iframe sizing from a previous plugin state.
    sendResize();
    requestAnimationFrame(sendResize);
    window.addEventListener('load', function() {
      sendResize();
      setTimeout(sendResize, 50);
      setTimeout(sendResize, 200);
      setTimeout(sendResize, 600);
    });

    // ============================================================================
    // STAGE 2 — LOG PANEL, INFO PANEL, CONNECTION, CLIPBOARD EXPORT
    // ============================================================================

    var PLUGIN_VERSION = 'v0.3.0';
    var logHistory = [];
    var logEntriesEl = null;
    var _ctaBtn = null;
    // Timestamp of the most recent command sent through the bridge (the same
    // event that appends to logHistory) — drives "Last action: Xs ago".
    var _lastActionAt = null;

    function ensureLogRefs() {
      if (!logEntriesEl) logEntriesEl = document.getElementById('log-entries');
      if (!_ctaBtn) _ctaBtn = document.getElementById('cta-btn');
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function log(message, level, ts) {
      level = level || 'info';
      ensureLogRefs();
      if (!logEntriesEl) return;

      // Deduplicate: consecutive identical message+level bumps the count badge.
      var last = logEntriesEl.lastElementChild;
      if (last && last.dataset.logMsg === message && last.dataset.logLevel === level) {
        var n = (parseInt(last.dataset.logCount, 10) || 1) + 1;
        last.dataset.logCount = n;
        var tsEl = last.querySelector('.log-ts');
        var countEl = last.querySelector('.log-count');
        if (tsEl && ts) tsEl.textContent = ts;
        if (countEl) countEl.textContent = '×' + n;
        return;
      }

      var entry = document.createElement('div');
      entry.className = 'log-entry ' + level;
      entry.dataset.logMsg = message;
      entry.dataset.logLevel = level;
      entry.dataset.logCount = '1';
      entry.innerHTML =
        '<span class="log-ts">' + escHtml(ts || '') + '</span>' +
        '<span class="log-msg" title="' + escHtml(message) + '">' + escHtml(message) + '</span>' +
        '<span class="log-dur"></span>' +
        '<span class="log-count"></span>';
      logEntriesEl.appendChild(entry);
      logEntriesEl.scrollTop = logEntriesEl.scrollHeight;
      while (logEntriesEl.children.length > 50) {
        logEntriesEl.removeChild(logEntriesEl.children[0]);
      }
    }

    function logWithHistory(message, level) {
      level = level || 'info';
      var now = new Date();
      var ts = ('0' + now.getHours()).slice(-2) + ':' +
               ('0' + now.getMinutes()).slice(-2) + ':' +
               ('0' + now.getSeconds()).slice(-2);
      logHistory.push({ ts: now.toISOString().replace('T', ' ').replace(/\.\d+Z/, ''), level: level, message: message });
      log(message, level, ts);
    }

    function copyLogToClipboard() {
      var lines = logHistory.map(function(e) {
        var prefix = e.level === 'error' ? '[!]  ' : e.level === 'warn' ? '[WARN]  ' : '';
        return e.ts + '  ' + prefix + e.message;
      });
      var text = 'Snail Bridge — Session Log\n'
        + 'Exported: ' + new Date().toISOString() + '\n'
        + 'Plugin: ' + PLUGIN_VERSION + '\n'
        + '------------------------------------------------\n'
        + lines.join('\n') + '\n';
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) {
        logWithHistory('Copied to clipboard (' + logHistory.length + ' entries)', 'success');
      } else {
        logWithHistory('Copy failed - clipboard not available', 'error');
      }
    }

    // Smart command summariser: turns raw message types and EXECUTE_CODE
    // payloads into human-readable log lines.
    var COMMAND_LABELS = {
      'GET_FILE_INFO': 'Get file info',
      'REFRESH_VARIABLES': 'Refresh variables',
      'GET_LOCAL_COMPONENTS': 'Get local components',
      'CLEAR_CONSOLE': 'Clear console',
      'RELOAD_UI': 'Reload UI',
      'GET_VARIABLES_DATA': 'Get variables data',
      'RESIZE_UI': null // internal, don't log
    };

    var FIGMA_API_PATTERNS = [
      { re: /figma\.create(\w+)/,           fn: function(m) { return 'Create ' + camelToWords(m[1]); } },
      { re: /figma\.getNodeByIdAsync/,      fn: function()  { return 'Get node'; } },
      { re: /figma\.setCurrentPageAsync/,   fn: function()  { return 'Switch page'; } },
      { re: /figma\.loadFontAsync/,         fn: function()  { return 'Load font'; } },
      { re: /figma\.loadAllPagesAsync/,     fn: function()  { return 'Load all pages'; } },
      { re: /figma\.currentPage\.findAll/,  fn: function()  { return 'Find nodes'; } },
      { re: /figma\.currentPage\.findOne/,  fn: function()  { return 'Find node'; } },
      { re: /figma\.(union|subtract|intersect|flatten)\b/, fn: function(m) { return 'Boolean ' + m[1]; } },
      { re: /\.exportAsync/,                fn: function()  { return 'Export'; } },
      { re: /\.clone\(\)/,                  fn: function()  { return 'Clone node'; } },
      { re: /\.remove\(\)/,                 fn: function()  { return 'Remove node'; } },
      { re: /\.appendChild\b/,              fn: function()  { return 'Append child'; } },
      { re: /\.insertChild\b/,              fn: function()  { return 'Insert child'; } },
      { re: /\.resize\(/,                   fn: function()  { return 'Resize'; } },
      { re: /\.characters\s*=/,             fn: function()  { return 'Set text'; } },
      { re: /\.fills\s*=/,                  fn: function()  { return 'Set fills'; } },
      { re: /\.strokes\s*=/,                fn: function()  { return 'Set strokes'; } },
      { re: /\.effects\s*=/,                fn: function()  { return 'Set effects'; } },
      { re: /combineAsVariants/,            fn: function()  { return 'Combine as variants'; } },
      { re: /swapComponent/,                fn: function()  { return 'Swap component'; } }
    ];

    function camelToWords(s) {
      return s.replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
    }

    function truncate(s, max) {
      max = max || 60;
      if (s.length <= max) return s;
      return s.substring(0, max - 1) + '…';
    }

    function summariseCommand(type, params) {
      if (type === 'EXECUTE_CODE' && params && params.code) {
        var firstLine = params.code.trim().split('\n')[0].trim();
        if (firstLine.indexOf('//') === 0) {
          return truncate(firstLine.replace(/^\/\/\s*/, '').replace(/[—–]/g, '-'));
        }
        var hits = [];
        for (var i = 0; i < FIGMA_API_PATTERNS.length; i++) {
          var m = params.code.match(FIGMA_API_PATTERNS[i].re);
          if (m) hits.push(FIGMA_API_PATTERNS[i].fn(m));
        }
        if (hits.length > 0) {
          var unique = hits.filter(function(v, i, a) { return a.indexOf(v) === i; });
          // Drop "Get node" when it appears alongside a more specific operation — it's just boilerplate setup
          var meaningful = unique.length > 1
            ? unique.filter(function(v) { return v !== 'Get node'; })
            : unique;
          return truncate(meaningful.join(', '));
        }
        // No recognisable Figma API pattern — prefix with <Code> so engineers can spot it, then show first line for context
        var lines = params.code.split('\n');
        for (var j = 0; j < lines.length; j++) {
          var line = lines[j].trim();
          if (line && line.indexOf('//') !== 0 && line.indexOf('/*') !== 0) {
            return truncate('<Code> ' + line);
          }
        }
        return '<Code>';
      }
      if (COMMAND_LABELS.hasOwnProperty(type)) return COMMAND_LABELS[type];
      // Fallback: turn "RENAME_VARIABLE" into "Rename variable"
      return type.replace(/_/g, ' ').toLowerCase().replace(/^\w/, function(c) { return c.toUpperCase(); });
    }

    // Wrap sendPluginCommand so every sent command is logged with a human summary and duration.
    var _origSendPluginCommand = window.sendPluginCommand;
    window.sendPluginCommand = function(type, params, timeoutMs) {
      var summary = summariseCommand(type, params);
      if (type === 'EXECUTE_CODE') markBuildActivity();
      var durEntry = null;
      var histIdx = -1;
      if (summary) {
        _lastActionAt = Date.now();
        logWithHistory(summary, 'info');
        histIdx = logHistory.length - 1;
        ensureLogRefs();
        durEntry = logEntriesEl ? logEntriesEl.lastElementChild : null;
      }
      var t0 = Date.now();
      return _origSendPluginCommand(type, params, timeoutMs).then(
        function(result) {
          if (durEntry) {
            var d = durEntry.querySelector('.log-dur');
            if (d) d.textContent = (Date.now() - t0) + 'ms';
            if (result && result.success === false) {
              durEntry.className = durEntry.className.replace(/\b(info|success|warn)\b/, 'error');
              durEntry.dataset.logLevel = 'error';
              var m = durEntry.querySelector('.log-msg');
              if (m && m.textContent.indexOf('[!]') !== 0) m.textContent = '[!] ' + m.textContent;
              if (histIdx >= 0 && logHistory[histIdx]) {
                logHistory[histIdx].level = 'error';
              }
            }
          }
          return result;
        },
        function(err) {
          if (durEntry) {
            var d = durEntry.querySelector('.log-dur');
            if (d) d.textContent = (Date.now() - t0) + 'ms';
            durEntry.className = durEntry.className.replace(/\b(info|success|warn)\b/, 'error');
            durEntry.dataset.logLevel = 'error';
            var m = durEntry.querySelector('.log-msg');
            if (m && m.textContent.indexOf('[!]') !== 0) m.textContent = '[!] ' + m.textContent;
            if (histIdx >= 0 && logHistory[histIdx]) {
              logHistory[histIdx].level = 'error';
              logHistory[histIdx].message = '[!] ' + logHistory[histIdx].message;
            }
          }
          throw err;
        }
      );
    };

    // Plugin update banner — shown when the server pushes
    // PLUGIN_UPDATE_AVAILABLE over the WebSocket. Dismiss sticks for the
    // session so repeated pushes don't nag.
    var _updateBannerDismissed = false;
    function showUpdateBanner() {
      if (_updateBannerDismissed) return;
      var b = document.getElementById('update-banner');
      if (b && !b.classList.contains('visible')) {
        b.classList.add('visible');
        autoResize();
      }
    }
    function dismissUpdateBanner() {
      _updateBannerDismissed = true;
      var b = document.getElementById('update-banner');
      if (b && b.classList.contains('visible')) {
        b.classList.remove('visible');
        autoResize();
      }
    }

    // Real Pause / Resume: toggles the local WebSocket bridge.
    function setCtaState(state) {
      ensureLogRefs();
      if (!_ctaBtn) return;
      _ctaBtn.style.display = ''; // markup starts it hidden until first honest state
      if (state === 'on')            { _ctaBtn.textContent = 'Pause';        _ctaBtn.disabled = false; }
      else if (state === 'paused')   { _ctaBtn.textContent = 'Resume';       _ctaBtn.disabled = false; }
      else if (state === 'reconnect'){ _ctaBtn.textContent = 'Try again';    _ctaBtn.disabled = false; }
      else if (state === 'scanning') { _ctaBtn.textContent = 'Connecting…';  _ctaBtn.disabled = true; }
    }

    function toggleLocalConnection() {
      ensureLogRefs();
      if (!_ctaBtn) return;
      var label = _ctaBtn.textContent;
      if (label === 'Pause') {
        if (typeof window.__wsDisconnectAll === 'function') window.__wsDisconnectAll();
        setCtaState('paused');
        deriveAndRenderStatus();
        logWithHistory('Paused', 'warn');
      } else if (label === 'Resume' || label === 'Try again') {
        setCtaState('scanning');
        logWithHistory('Looking for your AI app…', 'info');
        if (typeof window.__wsManualScan === 'function') window.__wsManualScan();
        else if (typeof window.__wsScanAndConnect === 'function') window.__wsScanAndConnect();
        deriveAndRenderStatus();
        // Watch for connection success or scan timeout.
        var attempts = 0;
        var poller = setInterval(function() {
          attempts++;
          var n = window.__wsGetActiveConnections ? window.__wsGetActiveConnections().length : 0;
          if (n > 0) {
            clearInterval(poller);
            setCtaState('on');
            deriveAndRenderStatus();
          } else if (attempts > 20) { // ~10s max
            clearInterval(poller);
            setCtaState('reconnect');
            deriveAndRenderStatus();
            logWithHistory('Couldn\'t find your AI app. Open Claude (or your AI assistant), then press Try again.', 'error');
          }
        }, 500);
      }
    }

    // Keep the CTA button honest about the real connection state: a
    // never-connected or dropped plugin shows a clickable "Try again" instead
    // of a misleading "Pause". Skips while a scan is mid-flight (button
    // disabled or __wsIsScanning) to avoid fighting the transient click state.
    function reconcileCta() {
      ensureLogRefs();
      if (!_ctaBtn) return;
      if (_ctaBtn.disabled) return;
      if (typeof window.__wsIsScanning === 'function' && window.__wsIsScanning()) return;
      var n = (typeof window.__wsGetActiveConnections === 'function') ? window.__wsGetActiveConnections().length : 0;
      var paused = (typeof window.__wsIsPaused === 'function') ? window.__wsIsPaused() : false;
      if (paused) {
        if (_ctaBtn.textContent !== 'Resume') setCtaState('paused');
      } else if (n > 0) {
        if (_ctaBtn.textContent !== 'Pause') setCtaState('on');
      } else {
        if (_ctaBtn.textContent !== 'Try again') setCtaState('reconnect');
      }
      // First reconcile also unhides the button with its honest label.
      if (_ctaBtn.style.display === 'none') _ctaBtn.style.display = '';
    }

    // Periodic reconcile of CTA + status pill/meta (cheap, <1ms). Also
    // refreshes the "· 12s ago" tail inside deriveAndRenderStatus.
    setInterval(function() {
      reconcileCta();
      deriveAndRenderStatus();
      renderQueue();
    }, 2000);

    // One-shot on first ready: render honest initial state and capture the
    // plugin's own version (used in the Activity export header) without
    // logging a command line — hence the unwrapped sender. The version is
    // read from the GET_FILE_INFO_RESULT handler below.
    setTimeout(function() {
      reconcileCta();
      deriveAndRenderStatus();
      _origSendPluginCommand('GET_FILE_INFO', {}).catch(function() { /* ignore */ });
    }, 500);

    // Size the plugin window to fit content on first paint.
    requestAnimationFrame(autoResize);

    // ============================================================================
    // MESSAGE HANDLER - Process responses from plugin worker
    // ============================================================================
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'UI_SIZE_LOCK') {
        sizeLocked = !!msg.locked;
        logWithHistory(sizeLocked ? 'Auto-resize off — the window keeps whatever size it is given' : 'Auto-resize on', 'info');
        if (!sizeLocked) sendResize();
        return;
      }

      // Generic result handler
      const handleResult = (resultType, dataKey) => {
        const request = window.__figmaPendingRequests.get(msg.requestId);
        if (request) {
          if (request.timeoutId) clearTimeout(request.timeoutId);
          if (msg.success) {
            var result = { success: true };
            if (dataKey && msg[dataKey] !== undefined) result[dataKey] = msg[dataKey];
            if (msg.data !== undefined) result.data = msg.data;
            if (msg.oldName !== undefined) result.oldName = msg.oldName;
            if (msg.instance !== undefined) result.instance = msg.instance;
            if (msg.slot !== undefined) result.slot = msg.slot;
            if (msg.warnings !== undefined) result.warnings = msg.warnings;
            if (msg.updatedCount !== undefined) result.updatedCount = msg.updatedCount;
            if (msg.nodes !== undefined) result.nodes = msg.nodes;
            // EXECUTE_CODE reports these two: resultAnalysis (silent-failure
            // hints, which figma_execute's own description tells callers to
            // check) and fileContext (the file the code actually ran in, which
            // is how per-file targeting is verified). code.js has always sent
            // them; this relay hop dropped them, so they never arrived.
            if (msg.resultAnalysis !== undefined) result.resultAnalysis = msg.resultAnalysis;
            if (msg.fileContext !== undefined) result.fileContext = msg.fileContext;
            request.resolve(result);
          } else {
            request.resolve({ success: false, error: msg.error || 'Unknown error' });
          }
          window.__figmaPendingRequests.delete(msg.requestId);
        }
      };

      // Handle message types
      switch (msg.type) {
        case 'VARIABLES_DATA':
          window.__figmaVariablesData = msg.data;
          window.__figmaVariablesReady = true;
          // A Figma-side data event says nothing about the WS connection —
          // record the fact and let the derived state decide the pill.
          bridgeError = false;
          deriveAndRenderStatus();
          console.log('[MCP Bridge] Active - ' + (msg.data.variables?.length || 0) + ' vars');
          // Forward to WebSocket client if connected
          if (window.__wsForwardVariables) window.__wsForwardVariables(msg.data);
          break;

        case 'COMPONENT_DATA':
          window.__figmaComponentData = msg.data;
          var req = window.__figmaComponentRequests.get(msg.requestId);
          if (req) { req.resolve(msg.data); window.__figmaComponentRequests.delete(msg.requestId); }
          break;

        case 'COMPONENT_ERROR':
          var req2 = window.__figmaComponentRequests.get(msg.requestId);
          if (req2) { req2.reject(new Error(msg.error)); window.__figmaComponentRequests.delete(msg.requestId); }
          break;

        case 'ERROR':
          window.__figmaVariablesReady = false;
          bridgeError = true; // pill shows "Something broke" + reopen hint
          deriveAndRenderStatus();
          console.error('[MCP Bridge] Error:', msg.error);
          break;

        // Variable operations
        case 'EXECUTE_CODE_RESULT':
          handleResult('EXECUTE_CODE', 'result');
          break;
        case 'UPDATE_VARIABLE_RESULT':
          handleResult('UPDATE_VARIABLE', 'variable');
